name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -ldflags "-X github.com/AS215932/hyrule-network-proxy/internal/version.Version=${{ github.sha }}" ./cmd/hyrule-network-proxy
